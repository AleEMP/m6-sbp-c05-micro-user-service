name: microservices-aemp

services:
  # ==========================================
  # BASES DE DATOS
  # ==========================================

  # 1. DB User
  postgres-user-dev:
    image: postgres:15-alpine
    container_name: postgres-user-dev
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. DB Product
  postgres-product-dev:
    image: postgres:15-alpine
    container_name: postgres-product-dev
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. DB Order (AGREGADO)
  postgres-order-dev:
    image: postgres:15-alpine
    container_name: postgres-order-dev
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # MICROSERVICIOS
  # ==========================================

  # 1. User Service
  user-service-dev:
    image: aleemp/m6-sbp-c05-micro-user-service:latest
    container_name: user-service-dev
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user-dev:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres-user-dev:
        condition: service_healthy
    networks:
      - microservice-network
    restart: unless-stopped

  # 2. Product Service
  product-service-dev:
    image: aleemp/m6-sbp-c05-micro-product-service:latest
    container_name: product-service-dev
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-product-dev:5432/productdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

      - USER_SERVICE_URL=http://user-service-dev:8081
    depends_on:
      postgres-product-dev:
        condition: service_healthy
      user-service-dev:
        condition: service_started
    networks:
      - microservice-network
    restart: unless-stopped

  # 3. Order Service
  order-service-dev:
    image: aleemp/m6-sbp-c05-micro-order-service:latest
    container_name: order-service-dev
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order-dev:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

      - USER_SERVICE_URL=http://user-service-dev:8081
      - PRODUCT_SERVICE_URL=http://product-service-dev:8082
    depends_on:
      postgres-order-dev:
        condition: service_healthy
      user-service-dev:
        condition: service_started
      product-service-dev:
        condition: service_started
    networks:
      - microservice-network
    restart: unless-stopped

# ==========================================
# REDES Y VOLÚMENES
# ==========================================
networks:
  microservice-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-product-data:
  postgres-order-data: